<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador QR - Salida</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0b0f19; margin: 0; }
  .card { background: linear-gradient(145deg, rgba(28, 35, 49, 0.9) 0%, rgba(11, 15, 25, 0.95) 100%); padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; border: 1px solid #2a3b5c; }
  .logo { max-width: 160px; height: auto; margin: 0 auto 20px auto; display: block; filter: drop-shadow(0 0 10px rgba(0, 162, 255, 0.4));}
  h2 { color: #00e5ff; margin-top: 0; font-size: 26px; font-family: 'Montserrat', sans-serif; text-transform: uppercase;}
  p { color: #a0abbc; margin-bottom: 25px; font-size: 15px;}
  canvas { border: 4px solid #1c2331; border-radius: 12px; padding: 15px; background: white; }
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
<div class="card">
  <img src="../img/logo.png" alt="Logo NAVA CORP" class="logo">
  <h2>Registro de Salida</h2>
  <p>Escanea este código para iniciar tu almuerzo</p>
  <canvas id="qr"></canvas>
</div>
<script>
  const hoy = new Date().toLocaleDateString('sv-SE');
  
  // ===== Direccion del sistema publicado en Firebase Hosting =====
  // Si cambia el dominio, edite SOLO esta linea:
  const BASE = "https://registro-bionetrico.web.app/clientes/itsacourier/";

  const urlSegura = BASE + "?token=" + hoy + "&tipo=salida";
  
  QRCode.toCanvas(document.getElementById("qr"), urlSegura, { 
      width: 280, 
      color: { dark: '#0056e0', light: '#ffffff' } 
  });
</script>
</body>
</html>
