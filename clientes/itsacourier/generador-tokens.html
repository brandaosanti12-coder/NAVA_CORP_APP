<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantalla de Tokens - ITSACOURIER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { 
      --primary: #00a2ff; 
      --bg: #0b0f19; 
      --card: #1c2331; 
      --text: #ffffff; 
      --text-muted: #a0abbc;
  }
  
  body { 
      font-family: 'Inter', sans-serif; 
      background: radial-gradient(circle at top right, #112240 0%, var(--bg) 70%); 
      color: var(--text); 
      padding: 30px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      min-height: 90vh;
      margin: 0;
  }
  
  .token-container { 
      background: linear-gradient(145deg, rgba(28, 35, 49, 0.8) 0%, rgba(11, 15, 25, 0.9) 100%);
      padding: 50px 40px; 
      border-radius: 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
      text-align: center; 
      width: 100%; 
      max-width: 500px; 
      margin-bottom: 20px; 
      border: 2px solid #2a3b5c; 
      backdrop-filter: blur(10px);
  }
  
  .token-title { 
      font-size: 16px; 
      font-weight: 600; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      margin-bottom: 15px; 
  }
  
  .token-display { 
      font-size: 72px; 
      font-weight: 800; 
      color: #00e5ff; 
      letter-spacing: 12px; 
      font-variant-numeric: tabular-nums; 
      margin: 25px 0; 
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
  }
  
  .progress-bar { 
      width: 100%; 
      height: 8px; 
      background: rgba(0,0,0,0.5); 
      border-radius: 4px; 
      overflow: hidden; 
      margin-top: 25px; 
  }
  
  .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, #0056e0 0%, #00a2ff 100%); 
      width: 100%; 
      transition: width 1s linear; 
  }
</style>
</head>
<body>

<div class="token-container">
  <div class="token-title">CÓDIGO DE ALMUERZO</div>
  <div class="token-display" id="token-display">------</div>
  <div style="font-size: 15px; color: var(--text-muted); margin-top: 10px;">
      Cambia en <span id="timer-display" style="color: #ffffff; font-weight: bold;">10</span> segundos
  </div>
  <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<p style="color: var(--text-muted); text-align: center; max-width: 500px; line-height: 1.6; font-size: 13px;">
  <strong><i class="fas fa-info-circle"></i> Pantalla de Oficina:</strong> Deja esta ventana abierta y visible para los empleados. Este panel actualiza el código de seguridad en la base de datos automáticamente.
</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({ 
    apiKey: "AIzaSyCyzE_spj6e0VASt5FP50_5m2Ya-GJloM4", 
    authDomain: "registro-bionetrico.firebaseapp.com", 
    projectId: "registro-bionetrico" 
});
const db = getFirestore(app);

let tiempoRestante = 10;

async function generarNuevoToken() {
    // Generar 6 dígitos aleatorios (del 100000 al 999999)
    const nuevoToken = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById("token-display").innerText = nuevoToken;
    
    // Subir a Firebase
    try {
        await setDoc(doc(db, "configuracion", "token_seguridad"), { valor: nuevoToken });
    } catch(e) {
        console.error("Error al actualizar el token en base de datos", e);
    }
    
    tiempoRestante = 10; // Reiniciar contador
}

setInterval(() => {
    tiempoRestante--;
    document.getElementById("timer-display").innerText = tiempoRestante;
    document.getElementById("progress-fill").style.width = `${(tiempoRestante / 10) * 100}%`;
    
    if(tiempoRestante <= 0) generarNuevoToken();
}, 1000);

generarNuevoToken(); // Generar el primero apenas se abre la pantalla
</script>
</body>
</html>
