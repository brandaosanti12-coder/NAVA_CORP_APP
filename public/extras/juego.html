<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minijuego - Salto Infinito</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; 
            -webkit-user-select: none;
        }

        body {
            background-color: #87CEEB; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            font-family: 'Poppins', sans-serif;
        }

        #app {
            background: #a0d8ef;
            width: 100%;
            height: 100%;
            max-width: 500px; 
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.95);
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        h2 { font-family: 'Fredoka One', cursive; font-size: 2.5rem; margin-bottom: 10px; color: #ff5722; text-align: center; }
        h3 { margin-top: 20px; color: #4CAF50; font-family: 'Fredoka One', cursive; }
        p { text-align: center; font-weight: bold; color: #555; }

        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 20px;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.4);
        }

        button:hover, button:active {
            background: #e64a19;
            transform: scale(1.05);
        }

        input {
            padding: 15px;
            font-size: 1.2rem;
            border: 3px solid #ff5722;
            border-radius: 15px;
            background: #fff;
            color: #333;
            text-align: center;
            outline: none;
            width: 80%;
            max-width: 300px;
            margin-top: 20px;
            font-weight: bold;
        }

        canvas {
            display: block;
            background: url('https://www.transparenttextures.com/patterns/cubes.png') #87CEEB;
            width: 100%;
            height: 100%;
            touch-action: none; 
            z-index: 1;
        }

        #score-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            font-family: 'Fredoka One', cursive;
            color: #fff;
            -webkit-text-stroke: 1px #333;
            z-index: 10;
        }

        .stats { font-size: 1.2rem; margin: 5px 0; }
        
        #leaderboard-list {
            list-style: none;
            width: 100%;
            max-width: 300px;
            margin-top: 15px;
            max-height: 180px;
            overflow-y: auto;
        }

        #leaderboard-list li {
            background: #f1f1f1;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-left: 5px solid #4CAF50;
        }

        .rank-1 { color: #d4af37; font-size: 1.1em;}
        .rank-2 { color: #9e9e9e; }
        .rank-3 { color: #cd7f32; }
    </style>
</head>
<body>

<div id="app">
    <!-- PANTALLA DE INICIO -->
    <div id="start-screen" class="screen">
        <button id="btn-aburrido">¿Aburrido? ¡Juega!</button>
        
        <div id="name-container" class="hidden" style="width: 100%;">
            <h2>Súper Salto</h2>
            <p>Mantén presionado los lados para moverte.</p>
            <p style="color:#E53935; font-size:0.9em; margin-top:5px;">Evita los pinchos rojos. ¡Pisa los resortes!</p>
            <div style="text-align: center;">
                <input type="text" id="player-name" placeholder="Tu apodo..." autocomplete="off" maxlength="12" />
                <br>
                <button id="btn-iniciar">Iniciar Juego</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="game-screen" class="screen hidden" style="padding: 0; background: transparent;">
        <div id="score-hud"><span id="current-score">0</span></div>
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- PANTALLA DE GAME OVER -->
    <div id="game-over-screen" class="screen hidden">
        <h2 id="death-message">¡Te caíste!</h2>
        <p class="stats">Jugador: <span id="final-name" style="color:#ff5722;"></span></p>
        <p class="stats">Altura Máxima: <span id="final-score" style="color:#ff5722;">0</span></p>
        <p class="stats">Tu Récord Global: <strong id="final-position" style="color:#4CAF50;">-</strong></p>
        
        <h3>Mejores Saltadores</h3>
        <ul id="leaderboard-list"></ul>
        
        <button id="btn-restart">Saltar de nuevo</button>
    </div>
</div>

<script>
    let playerName = "";
    let score = 0;
    let gameLoop;
    let isPlaying = false;
    
    const app = document.getElementById('app');
    const startScreen = document.getElementById('start-screen');
    const nameContainer = document.getElementById('name-container');
    const btnAburrido = document.getElementById('btn-aburrido');
    const btnIniciar = document.getElementById('btn-iniciar');
    const inputName = document.getElementById('player-name');
    
    const gameScreen = document.getElementById('game-screen');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const hudScore = document.getElementById('current-score');
    
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScore = document.getElementById('final-score');
    const finalPosition = document.getElementById('final-position');
    const finalName = document.getElementById('final-name');
    const leaderboardList = document.getElementById('leaderboard-list');
    const btnRestart = document.getElementById('btn-restart');
    const deathMessage = document.getElementById('death-message');

    let player = { x: 0, y: 0, width: 30, height: 30, dx: 0, dy: 0, speed: 6, jumpPower: -10.5, superJumpPower: -18, gravity: 0.4 };
    let platforms = [];
    let keys = { left: false, right: false };

    function resizeCanvas() {
        canvas.width = app.clientWidth;
        canvas.height = app.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') keys.left = true;
        if (e.code === 'ArrowRight') keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft') keys.left = false;
        if (e.code === 'ArrowRight') keys.right = false;
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        let touchX = e.touches[0].clientX;
        let rect = canvas.getBoundingClientRect();
        let x = touchX - rect.left;
        if (x < canvas.width / 2) { keys.left = true; keys.right = false; } 
        else { keys.right = true; keys.left = false; }
    }, {passive: false});

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        keys.left = false;
        keys.right = false;
    }, {passive: false});

    btnAburrido.addEventListener('click', () => {
        btnAburrido.classList.add('hidden');
        nameContainer.classList.remove('hidden');
        inputName.focus();
    });

    btnIniciar.addEventListener('click', () => {
        if(inputName.value.trim() === "") {
            alert("¡Necesitas un nombre para el ranking!");
            return;
        }
        playerName = inputName.value.trim();
        startScreen.classList.add('hidden');
        resizeCanvas();
        startGame();
    });

    btnRestart.addEventListener('click', () => {
        gameOverScreen.classList.add('hidden');
        startGame();
    });

    function createPlatforms() {
        platforms = [];
        // Plataforma base inicial
        platforms.push({ x: canvas.width / 2 - 35, y: canvas.height - 50, width: 70, height: 15, booster: false, obstacle: false, springTimer: 0 });
        
        let currentY = canvas.height - 50;
        for (let i = 1; i < 15; i++) {
            // Distancia vertical más corta y amigable (50 a 80 píxeles max)
            currentY -= (40 + Math.random() * 40); 
            let pWidth = 65 + Math.random() * 25;
            platforms.push({
                x: Math.random() * (canvas.width - pWidth),
                y: currentY,
                width: pWidth,
                height: 15,
                booster: Math.random() < 0.12, 
                obstacle: Math.random() < 0.15,
                springTimer: 0
            });
            
            if (platforms[i].booster) platforms[i].obstacle = false;
        }
    }

    function startGame() {
        score = 0;
        isPlaying = true;
        createPlatforms();
        
        player.x = canvas.width / 2 - player.width / 2;
        player.y = canvas.height - 150;
        player.dy = player.jumpPower; 
        
        hudScore.innerText = score;
        gameScreen.classList.remove('hidden');
        
        updateGame();
    }

    function updateGame() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Movimiento Horizontal
        if (keys.left) player.x -= player.speed;
        if (keys.right) player.x += player.speed;

        // Efecto Pac-Man (Atravesar la pantalla)
        if (player.x + player.width < 0) player.x = canvas.width;
        if (player.x > canvas.width) player.x = -player.width;

        player.dy += player.gravity;
        player.y += player.dy;

        // Actualizar y Dibujar Plataformas
        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];
            
            // Dibujar Plataforma
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.width, p.height, 5);
            ctx.fill();

            // Dibujar Obstáculo (Pinchos)
            let obsSize = 20;
            let obsX = p.x + (p.width / 2) - (obsSize / 2);
            let obsY = p.y - obsSize;

            if (p.obstacle) {
                ctx.fillStyle = '#E53935';
                ctx.beginPath();
                ctx.moveTo(obsX, p.y);
                ctx.lineTo(obsX + obsSize/2, obsY);
                ctx.lineTo(obsX + obsSize, p.y);
                ctx.fill();

                if (player.x < obsX + obsSize &&
                    player.x + player.width > obsX &&
                    player.y < obsY + obsSize &&
                    player.y + player.height > obsY) {
                    endGame("¡Te pinchaste!");
                    return;
                }
            }

            // Dibujar Resorte y Animación
            let boostW = 20;
            let boostX = p.x + (p.width / 2) - (boostW / 2);
            
            if (p.booster) {
                if (p.springTimer > 0) p.springTimer--;

                // Lógica de estiramiento visual
                let extH = 10;
                if (p.springTimer > 10) {
                    extH = 10 + (20 - p.springTimer) * 2; // Sube hasta 30
                } else if (p.springTimer > 0) {
                    extH = 10 + p.springTimer * 2; // Baja a 10
                }

                let boostY = p.y - extH;

                // Base metálica del resorte
                ctx.fillStyle = '#9E9E9E'; 
                ctx.fillRect(boostX, p.y - 4, boostW, 4);

                // Muelle amarillo
                ctx.fillStyle = '#FFEB3B';
                ctx.fillRect(boostX + 2, boostY + 4, boostW - 4, extH - 4);
                
                // Tapa superior naranja
                ctx.fillStyle = '#F57F17';
                ctx.fillRect(boostX, boostY, boostW, 4);
            }

            // Colisión para el salto
            if (player.dy > 0 && 
                player.x + player.width > p.x && 
                player.x < p.x + p.width && 
                player.y + player.height > p.y && 
                player.y + player.height < p.y + p.height + player.dy) {
                
                if (p.booster && player.x + player.width > boostX && player.x < boostX + boostW) {
                    player.dy = player.superJumpPower; // Súper Salto
                    p.springTimer = 20; // Iniciar animación de rebote de 20 frames
                } else {
                    player.dy = player.jumpPower; // Salto Normal
                }
            }
        }

        // Movimiento de Cámara
        if (player.y < canvas.height / 2) {
            let diff = (canvas.height / 2) - player.y;
            player.y = canvas.height / 2;
            score += Math.floor(diff / 10);
            hudScore.innerText = score;

            for (let i = 0; i < platforms.length; i++) {
                platforms[i].y += diff;
            }
        }

        // Reciclaje de plataformas con distancia ajustada
        for (let i = 0; i < platforms.length; i++) {
            if (platforms[i].y > canvas.height + 100) {
                let minY = platforms[0].y;
                for(let j=1; j<platforms.length; j++) {
                    if(platforms[j].y < minY) minY = platforms[j].y;
                }
                
                // Distancia vertical ajustada para fácil alcance
                platforms[i].y = minY - (40 + Math.random() * 40);
                platforms[i].x = Math.random() * (canvas.width - platforms[i].width);
                
                platforms[i].booster = Math.random() < 0.12;
                platforms[i].obstacle = !platforms[i].booster && Math.random() < 0.15; 
                platforms[i].springTimer = 0;
            }
        }

        // Dibujar Jugador
        ctx.fillStyle = '#ff5722';
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.width, player.height, 8);
        ctx.fill();
        
        ctx.fillStyle = 'white';
        ctx.fillRect(player.x + 5, player.y + 5, 8, 8);
        ctx.fillRect(player.x + 17, player.y + 5, 8, 8);
        ctx.fillStyle = 'black';
        let eyeOffset = keys.left ? -2 : (keys.right ? 2 : 0);
        ctx.fillRect(player.x + 7 + eyeOffset, player.y + 7, 4, 4);
        ctx.fillRect(player.x + 19 + eyeOffset, player.y + 7, 4, 4);

        if (player.y > canvas.height) {
            endGame("¡Te caíste!");
            return;
        }

        gameLoop = requestAnimationFrame(updateGame);
    }

    function endGame(reason) {
        isPlaying = false;
        cancelAnimationFrame(gameLoop);
        
        deathMessage.innerText = reason;
        gameScreen.classList.add('hidden');
        gameOverScreen.classList.remove('hidden');

        finalName.innerText = playerName;
        finalScore.innerText = score;

        saveScoreAndShowLeaderboard();
    }

    function saveScoreAndShowLeaderboard() {
        let leaderboard = JSON.parse(localStorage.getItem('minijuego_doodle_leaderboard_v2')) || [];
        let existingPlayerIndex = leaderboard.findIndex(entry => entry.name === playerName);
        
        if (existingPlayerIndex !== -1) {
            if (score > leaderboard[existingPlayerIndex].score) {
                leaderboard[existingPlayerIndex].score = score;
            }
        } else {
            leaderboard.push({ name: playerName, score: score });
        }
        
        leaderboard.sort((a, b) => b.score - a.score);
        if(leaderboard.length > 50) leaderboard = leaderboard.slice(0, 50);
        localStorage.setItem('minijuego_doodle_leaderboard_v2', JSON.stringify(leaderboard));

        let position = leaderboard.findIndex(entry => entry.name === playerName) + 1;
        finalPosition.innerText = `#${position}`;

        leaderboardList.innerHTML = '';
        let top5 = leaderboard.slice(0, 5);
        
        top5.forEach((entry, index) => {
            let li = document.createElement('li');
            let rankClass = index === 0 ? 'rank-1' : (index === 1 ? 'rank-2' : (index === 2 ? 'rank-3' : ''));
            li.innerHTML = `<span class="${rankClass}">#${index + 1} ${entry.name}</span> <span class="${rankClass}">${entry.score} pts</span>`;
            leaderboardList.appendChild(li);
        });
    }

    resizeCanvas();
</script>

</body>
</html>
